[build]
  command = "prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"
  included_files = ["prisma/**", "node_modules/@prisma/client/**", "node_modules/.prisma/**"]