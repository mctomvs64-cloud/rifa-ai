[build]
  command = "prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
  [plugins.inputs]
    edgeFunctionDir = ".netlify/edge-functions"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"